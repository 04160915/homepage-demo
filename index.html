<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>沈祥暄</title>

<style>
  :root {
    --bg:        #fdfdfc;
    --text:      #1a1a1a;
    --muted:     #6b6b6b;
    --accent:    #2f6f5e;
    --line:      #e6e4e0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #131313;
      --text:   #ededed;
      --muted:  #9a9a9a;
      --accent: #6ec9ac;
      --line:   #2a2a2a;
    }
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(4rem, 14vh, 9rem) 0 4rem;
  }

  /* ── 名字 ───────────────────────────────── */
  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .rule {
    width: 3rem;
    height: 3px;
    margin: 1.25rem 0 3rem;
    border-radius: 2px;
    background: var(--accent);
  }

  /* ── 正文段落 ───────────────────────────── */
  p { margin: 0 0 1.25rem; }

  .intro {
    font-size: 1.05rem;
    color: var(--text);
  }

  /* ── 页脚 ───────────────────────────────── */
  footer {
    margin-top: 4rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>

  <h1>沈祥暄</h1>
  <div class="rule"></div>

  <p class="intro">
    我目前是复旦大学经济学院的研究生，专业是税务；平时喜欢烘焙、游泳。
  </p>
  <p class="intro">
    正在学习如何使用 Claude Code，我一直都很想学习这项技能，希望能通过人工智能这门课熟练地掌握。
  </p>

  <footer>© <span id="year"></span> 沈祥暄</footer>

</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
